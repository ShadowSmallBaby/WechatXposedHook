plugins {
    id 'com.android.application'
}

def envValue = { String name -> System.getenv(name)?.trim() }
def ksBase64 = envValue('WXH_KEYSTORE_BASE64')
def signingStorePassword = envValue('WXH_STORE_PASSWORD')
def signingKeyAlias = envValue('WXH_KEY_ALIAS')
def signingKeyPassword = envValue('WXH_KEY_PASSWORD')
def hasSigning = ksBase64 && signingStorePassword && signingKeyAlias && signingKeyPassword

android {
    namespace 'github.shadowbaby.wechatxposed.hook'
    compileSdk 37
    ndkVersion '28.2.13676358'

    defaultConfig {
        applicationId 'github.shadowbaby.wechatxposed.hook'
        minSdk 26
        targetSdk 37
        versionCode 2
        versionName '1.1'

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    signingConfigs {
        release {
            if (hasSigning) {
                def keystore = layout.buildDirectory.file('keystore/release.jks').get().asFile
                keystore.parentFile.mkdirs()
                try {
                    keystore.bytes = Base64.getDecoder().decode(ksBase64.replaceAll('\\s', ''))
                } catch (IllegalArgumentException error) {
                    throw new GradleException('WXH_KEYSTORE_BASE64 不是合法 Base64: '
                            + error.message)
                }
                storeFile keystore
                storePassword signingStorePassword
                keyAlias signingKeyAlias
                keyPassword signingKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig hasSigning ? signingConfigs.release : signingConfigs.debug
        }
    }

    flavorDimensions 'framework', 'wx', 'edition'
    productFlavors {
        legacy { dimension 'framework' }
        modern { dimension 'framework' }

        wx244 {
            dimension 'wx'
            buildConfigField 'String', 'WX_PACK', '"wx6_2.44"'
        }
        wx30 {
            dimension 'wx'
            buildConfigField 'String', 'WX_PACK', '"x7_3.0"'
        }

        publicEdition {
            dimension 'edition'
            buildConfigField 'boolean', 'FULL_EDITION', 'false'
        }
        fullEdition {
            dimension 'edition'
            buildConfigField 'boolean', 'FULL_EDITION', 'true'
        }
    }

    buildFeatures {
        buildConfig true
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
        wx244 {
            assets.srcDirs = ["$buildDir/generated/featurepacks/wx244"]
        }
        wx30 {
            assets.srcDirs = ["$buildDir/generated/featurepacks/wx30"]
        }
        publicEdition {
            java.srcDirs += ["$buildDir/generated/secrets/publicEdition/java"]
        }
        fullEdition {
            java.srcDirs += ["$buildDir/generated/secrets/fullEdition/java"]
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

}

androidComponents {
    onVariants(selector().all()) { variant ->
        def flavors = variant.productFlavors.collectEntries { [(it.first): it.second] }
        def framework = flavors['framework']
        def wx = flavors['wx'] == 'wx244' ? '2.44' : '3.0'
        def edition = flavors['edition'] == 'fullEdition' ? '-full' : ''
        def appVersion = android.defaultConfig.versionName
        variant.outputs.each { output ->
            output.outputFileName.set(
                    "WeXposedHook-${framework}-wx${wx}-v${appVersion}${edition}.apk")
        }
    }
}

def masterKey = System.getenv('WXH_MASTER_KEY')
def masterKeyBytes = null    // 32 字节原始值,给 clang 用
def masterKeyText = null     // 原始文本(hex 或 Base64),给 encode_secrets.py 用

def keyBytesLiteral = { String text ->
    def isHex = text.length() == 64 && (text ==~ /[0-9a-fA-F]{64}/)
    byte[] raw
    if (isHex) {
        raw = new byte[32]
        for (int index = 0; index < 32; index++) {
            raw[index] = (byte) Integer.parseInt(text.substring(index * 2, index * 2 + 2), 16)
        }
    } else {
        try {
            raw = Base64.getDecoder().decode(text)
        } catch (IllegalArgumentException error) {
            throw new GradleException('主密钥既不是 64 位 hex,也不是合法 Base64')
        }
    }
    if (raw.length != 32) {
        throw new GradleException('主密钥必须是 32 字节(256 bit),实际 ' + raw.length + ' 字节')
    }
    return raw.collect { String.format('0x%02x', it) }.join(', ')
}

if (masterKey != null && !masterKey.trim().isEmpty()) {
    masterKey = masterKey.trim()
    masterKeyBytes = keyBytesLiteral(masterKey)
    masterKeyText = masterKey
}

def nativeCompileFlags = { ->
    def repoRoot = rootProject.projectDir.absolutePath.replace('\\', '/')
    return ['-shared', '-fPIC', '-O2',
            '-fvisibility=hidden', '-fno-asynchronous-unwind-tables', '-fno-unwind-tables',
            '-Wl,--gc-sections', '-Wl,-s',
            '-ffile-prefix-map=' + repoRoot + '=.',
            '-Wl,--build-id=none']
}

def encodeSecrets = tasks.register('encodeSecrets') {
    def script = rootProject.file('scripts/encode_secrets.py')
    def table = rootProject.file('scripts/secrets_table.py')
    def output = layout.buildDirectory.dir('generated/secrets')
    def secretsB64 = System.getenv('WXH_SECRETS_B64')
    onlyIf { script.isFile() && (masterKeyText != null || secretsB64 != null || table.isFile()) }
    if (script.isFile()) {
        inputs.file(script)
        inputs.property('wxhMasterKey', masterKeyText ?: '')
        inputs.property('wxhSecrets', secretsB64 ?: '')
    }
    if (table.isFile()) {
        inputs.file(table)
    }
    outputs.dir(output)
    doLast {
        def python = System.getenv('WXH_PYTHON') ?: 'python'
        def command = [python, '-X', 'utf8', script.absolutePath,
                       '--output-root', output.get().asFile.absolutePath]
        if (masterKeyText != null) {
            command.addAll(['--master-key', masterKeyText])
        }
        def result = providers.exec {
            commandLine command
            workingDir rootProject.projectDir
            ignoreExitValue = true
        }
        if (result.result.get().exitValue != 0) {
            throw new GradleException('encode_secrets.py 执行失败: 检查 WXH_MASTER_KEY / WXH_SECRETS_B64')
        }
    }
}

tasks.named('preBuild') {
    dependsOn encodeSecrets
}

def buildNative = tasks.register('buildNativeSecret') {
    def jniDir = layout.projectDirectory.dir('src/main/jni')
    def sources = fileTree(jniDir) { include '*.c' }
    def headers = fileTree(jniDir) { include '*.inc' }
    def abis = ['arm64-v8a': 'aarch64-linux-android26',
                'armeabi-v7a': 'armv7a-linux-androideabi26']
    def sdkDir = { ->
        def props = new Properties()
        def file = rootProject.file('local.properties')
        if (file.isFile()) {
            file.withInputStream { props.load(it) }
        }
        def dir = props.getProperty('sdk.dir') ?: System.getenv('ANDROID_SDK_ROOT') ?: System.getenv('ANDROID_HOME')
        if (!dir) {
            throw new GradleException('找不到 Android SDK:请在 local.properties 里设 sdk.dir')
        }
        return new File(dir)
    }()
    def ndkDir = new File(sdkDir, 'ndk/' + android.ndkVersion)
    inputs.files(sources)
    inputs.files(headers)
    inputs.property('wxhMasterKey', masterKeyText ?: '')
    inputs.property('wxhNativeFlags', nativeCompileFlags().join(' '))
    abis.each { abi, prefix ->
        outputs.file(layout.projectDirectory.file('src/main/jniLibs/' + abi + '/libwexhook.so'))
    }
    doLast {
        def binDir = new File(ndkDir, 'toolchains/llvm/prebuilt/windows-x86_64/bin')
        if (!binDir.isDirectory()) {
            binDir = new File(ndkDir, 'toolchains/llvm/prebuilt/linux-x86_64/bin')
        }
        abis.each { abi, prefix ->
            def compiler = new File(binDir, prefix + '-clang.cmd')
            if (!compiler.isFile()) {
                compiler = new File(binDir, prefix + '-clang')
            }
            if (!compiler.isFile()) {
                throw new GradleException('找不到 NDK 交叉编译器: ' + compiler)
            }
            def output = layout.projectDirectory.dir('src/main/jniLibs/' + abi)
            def target = output.file('libwexhook.so')
            output.asFile.mkdirs()
            def command = [compiler.absolutePath] + nativeCompileFlags() + [
                           '-o', target.asFile.absolutePath]
            if (masterKeyBytes != null) {
                command.add('-DWXH_MASTER_KEY_BYTES=' + masterKeyBytes)
            }
            sources.files.each { command.add(it.absolutePath.replace('\\', '/')) }
            def result = providers.exec {
                commandLine command
                ignoreExitValue = true
            }
            if (result.result.get().exitValue != 0) {
                throw new GradleException('clang 编译失败: ' + abi)
            }
        }
    }
}

tasks.named('preBuild') {
    // so 由 CI 的 native job 构建并缓存；只有缺失时才在本机构建兜底。
    def soMissing = ['arm64-v8a', 'armeabi-v7a'].any {
        !layout.projectDirectory.file('src/main/jniLibs/' + it + '/libwexhook.so').asFile.isFile()
    }
    if (soMissing) {
        dependsOn buildNative
    }
}

tasks.register('verifyNativeSecret') {
    def jniDir = layout.projectDirectory.dir('src/main/jni')
    def committed = ['arm64-v8a', 'armeabi-v7a'].collect {
        layout.projectDirectory.file('src/main/jniLibs/' + it + '/libwexhook.so').asFile
    }
    def reference = layout.buildDirectory.dir('native-reference')
    onlyIf { jniDir.asFile.isDirectory() }
    doLast {
        def backups = [:]
        committed.each { file ->
            backups[file] = file.isFile() ? file.bytes : null
        }
        def abis = ['arm64-v8a': 'aarch64-linux-android26',
                    'armeabi-v7a': 'armv7a-linux-androideabi26']
        def props = new Properties()
        def local = rootProject.file('local.properties')
        if (local.isFile()) {
            local.withInputStream { props.load(it) }
        }
        def sdk = props.getProperty('sdk.dir') ?: System.getenv('ANDROID_SDK_ROOT') ?: System.getenv('ANDROID_HOME')
        if (!sdk) {
            throw new GradleException('找不到 Android SDK:请在 local.properties 里设 sdk.dir')
        }
        def ndk = new File(sdk, 'ndk/' + android.ndkVersion)
        def binDir = new File(ndk, 'toolchains/llvm/prebuilt/windows-x86_64/bin')
        if (!binDir.isDirectory()) {
            binDir = new File(ndk, 'toolchains/llvm/prebuilt/linux-x86_64/bin')
        }
        def sources = fileTree(jniDir) { include '*.c' }
        def stale = []
        abis.each { abi, prefix ->
            def committedFile = layout.projectDirectory.file('src/main/jniLibs/' + abi + '/libwexhook.so').asFile
            if (!committedFile.isFile()) {
                stale.add(abi + ': 工作区没有 so')
                return
            }
            def compiler = new File(binDir, prefix + '-clang.cmd')
            if (!compiler.isFile()) {
                compiler = new File(binDir, prefix + '-clang')
            }
            def rebuilt = new File(reference.get().asFile, abi + '/libwexhook.so')
            rebuilt.parentFile.mkdirs()
            def command = [compiler.absolutePath] + nativeCompileFlags() + [
                           '-o', rebuilt.absolutePath]
            if (masterKeyBytes != null) {
                command.add('-DWXH_MASTER_KEY_BYTES=' + masterKeyBytes)
            }
            sources.files.each { command.add(it.absolutePath.replace('\\', '/')) }
            def result = providers.exec {
                commandLine command
                ignoreExitValue = true
            }
            if (result.result.get().exitValue != 0) {
                throw new GradleException('参考 so 编译失败: ' + abi)
            }
            if (!java.util.Arrays.equals(backups[committedFile], rebuilt.bytes)) {
                stale.add(abi)
            }
        }
        if (!stale.isEmpty()) {
            throw new GradleException('提交的 so 与源码/密钥不一致(' + stale.join(', ') + ')。'
                    + '若提示「工作区没有 so」,先跑 ./gradlew buildNativeSecret 再校验、再同步;'
                    + '否则说明源码或密钥变了而 so 没重编,重新生成后再发布')
        }
        logger.lifecycle('verifyNativeSecret: 提交的 so 与源码、主密钥一致')
    }
}

def generateFeaturePacks = tasks.register('generateFeaturePacks', Exec) {
    def script = rootProject.file('scripts/build_release_packs.py')
    def packs = layout.buildDirectory.dir('generated/featurepacks')
    def python = System.getProperty('os.name').toLowerCase().contains('windows')
            ? 'python' : 'python3'
    commandLine python, script.absolutePath, '--output-root', packs.get().asFile.absolutePath
    onlyIf { script.isFile() && rootProject.file('xmetadata').isDirectory() }
    inputs.file(script)
    inputs.files(rootProject.fileTree('xmetadata') { include 'wx6/**', 'wx7/**' })
    outputs.files(packs.get().file('wx244/wx6_2.44.zip'),
            packs.get().file('wx30/x7_3.0.zip'))
}

tasks.named('preBuild') {
    dependsOn generateFeaturePacks
}

dependencies {
    compileOnly 'de.robv.android.xposed:api:82'
    compileOnly 'io.github.libxposed:api:102.0.0'
}
