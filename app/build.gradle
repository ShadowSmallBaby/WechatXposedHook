plugins {
    id 'com.android.application'
}

android {
    namespace 'github.shadowbaby.wechatxposed.hook'
    compileSdk 36

    defaultConfig {
        applicationId 'github.shadowbaby.wechatxposed.hook'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '1.0'
    }

    signingConfigs {
        release {
            // 密钥库位于项目根目录（data/release.keystore）
            def ks = rootProject.file('data/release.keystore')
            if (ks.exists()) {
                storeFile ks
                storePassword 'wxmodulehook'
                keyAlias 'wxmodulehook'
                keyPassword 'wxmodulehook'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Xposed API（compileOnly，不打进 dex；运行时由 LSPosed/EdXposed 提供）
    compileOnly fileTree(dir: 'src/libs', include: ['*.jar'])
}
