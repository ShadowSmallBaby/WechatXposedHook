// WxModuleHook 1.2 —— 重建源码编译为 Xposed 模块 APK
//
// 模块结构（对照原 apk WxModuleHook-1.2_3.apk）：
//   - 单 classes.dex，入口 github.shadowbaby.wechatxposed.hook.XposedInit（assets/xposed_init 指向）
//   - 无 Activity / Service，纯 IXposedHookZygoteInit
//   - minSdk 26 / targetSdk 36，包名 github.shadowbaby.wechatxposed.hook，versionCode 3，versionName 1.2

plugins {
    id 'com.android.application'
}

android {
    namespace 'github.shadowbaby.wechatxposed.hook'
    compileSdk 36

    defaultConfig {
        applicationId 'github.shadowbaby.wechatxposed.hook'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '1.0'
    }

    signingConfigs {
        release {
            // 密钥库位于项目根目录（data/release.keystore）
            def ks = rootProject.file('data/release.keystore')
            if (ks.exists()) {
                storeFile ks
                storePassword 'wxmodulehook'
                keyAlias 'wxmodulehook'
                keyPassword 'wxmodulehook'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Xposed API（compileOnly，不打进 dex；运行时由 LSPosed/EdXposed 提供）
    compileOnly fileTree(dir: 'src/libs', include: ['*.jar'])
}
