name: Build APKs

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android platform
        run: |
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "${ANDROID_SDK_ROOT:-$ANDROID_HOME}" -path '*/cmdline-tools/*/bin/sdkmanager' -type f | sort | tail -1)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-37.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build all release variants
        run: ./gradlew :app:assembleRelease --console=plain --stacktrace

      - name: Collect release assets
        run: |
          test -f app/src/wx244/pack/wx6_2.44.zip
          test -f app/src/wx30/pack/x7_3.0.zip
          test -f app/src/wx30/assets/8af2692bdcb8661da163b4204b5f5d5e
          test -f app/src/wx30/assets/shell.apk
          test "$(unzip -Z1 app/src/wx244/pack/wx6_2.44.zip | wc -l)" -eq 15
          test "$(unzip -Z1 app/src/wx30/pack/x7_3.0.zip | wc -l)" -eq 15
          unzip -Z1 app/build/outputs/apk/modernWx244/release/*.apk | grep -qx 'assets/14e777717682cce8a53cfcb34a22d65'
          unzip -Z1 app/build/outputs/apk/modernWx30/release/*.apk | grep -qx 'assets/14e777717682cce8a53cfcb34a22d65'
          unzip -Z1 app/build/outputs/apk/modernWx30/release/*.apk | grep -qx 'assets/8af2692bdcb8661da163b4204b5f5d5e'
          unzip -Z1 app/build/outputs/apk/modernWx30/release/*.apk | grep -qx 'assets/shell.apk'
          test "$(unzip -Z1 app/build/outputs/apk/modernWx30/release/*.apk | grep -c '^assets/')" -eq 17
          mkdir -p dist
          for apk in app/build/outputs/apk/*/release/WeXposedHook-*.apk; do
            cp "$apk" dist/
          done
          ls -1 dist
          test "$(ls -1 dist/*.apk | wc -l)" -eq 4

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apks
          path: dist/*.apk
          if-no-files-found: error

      - name: Build release notes
        run: |
          tag="${GITHUB_REF_NAME}"
          section="$(mktemp)"
          if [ -f CHANGELOG.md ]; then
            awk -v t="## $tag" '
              $0 == t { found=1; next }
              found && substr($0, 1, 3) == "## " { exit }
              found { print }
            ' CHANGELOG.md > "$section"
          fi
          {
            echo "## 更新内容 / Changes"
            echo
            if [ -s "$section" ]; then
              cat "$section"
            else
              echo "本次发布未在 CHANGELOG 中记录。"
            fi
            echo
            echo "## 下载哪个包？ / Which APK?"
            echo
            echo "| 微X 版本 | 现代 LibXposed（API ≥ 102） | 经典 Xposed / API < 102 |"
            echo "|---|---|---|"
            echo "| 微X 2.44 | \`WeXposedHook-modern-wx2.44-${tag}.apk\` | \`WeXposedHook-legacy-wx2.44-${tag}.apk\` |"
            echo "| X 3.0 | \`WeXposedHook-modern-wx3.0-${tag}.apk\` | \`WeXposedHook-legacy-wx3.0-${tag}.apk\` |"
            echo
            echo "- 先确认已安装的微X是 **2.44** 还是 **X 3.0**，再按框架二选一。"
            echo "- 现代包若提示「该模块需要更新的 Xposed 版本 102」，改用 **legacy** 包。"
            echo "- 作用域勾选 **微信**。"
            echo "- 环境要求：Android 8.0+、微信 8.0.49、微X模块 2.44 / X 3.0。"
            echo
            prev=$(git describe --tags --abbrev=0 "${tag}^" 2>/dev/null || true)
            if [ -n "$prev" ]; then
              echo "**Full Changelog**: https://github.com/ShadowSmallBaby/WechatXposedHook/compare/${prev}...${tag}"
            fi
          } > release-notes.md
          echo "--- release notes ---"
          cat release-notes.md

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ github.token }}
          tag_name: ${{ github.ref_name }}
          files: dist/*.apk
          fail_on_unmatched_files: true
          body_path: release-notes.md