name: Build APKs

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android platform
        run: |
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "${ANDROID_SDK_ROOT:-$ANDROID_HOME}" -path '*/cmdline-tools/*/bin/sdkmanager' -type f | sort | tail -1)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-37.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Check required secret
        if: github.repository == 'ShadowSmallBaby/WechatXposedHookCore'
        env:
          RT: ${{ secrets.PUBLIC_REPO_TOKEN }}
        run: |
          if [ -z "$RT" ]; then echo "::error::缺少 secret PUBLIC_REPO_TOKEN"; exit 1; fi

      - name: Prepare release signing
        env:
          KS: ${{ secrets.WXH_KEYSTORE_BASE64 }}
          SP: ${{ secrets.WXH_STORE_PASSWORD }}
          KA: ${{ secrets.WXH_KEY_ALIAS }}
          KP: ${{ secrets.WXH_KEY_PASSWORD }}
        run: |
          if [ -n "$KS" ]; then
            KS_ONE_LINE=$(printf '%s' "$KS" | tr -d '\r\n')
            {
              echo "WXH_KEYSTORE_BASE64=$KS_ONE_LINE"
              echo "WXH_STORE_PASSWORD=$SP"
              echo "WXH_KEY_ALIAS=$KA"
              echo "WXH_KEY_PASSWORD=$KP"
            } >> "$GITHUB_ENV"
            echo "Release signing configured from secrets."
          else
            echo "No signing secrets found; release APKs will be debug-signed."
          fi

      - name: Prepare feature secrets
        if: github.repository == 'ShadowSmallBaby/WechatXposedHookCore'
        env:
          MK: ${{ secrets.WXH_MASTER_KEY }}
          SB: ${{ secrets.WXH_SECRETS_B64 }}
        run: |
          if [ -z "$MK" ]; then echo "::error::缺少 secret WXH_MASTER_KEY"; exit 1; fi
          if [ -z "$SB" ]; then echo "::error::缺少 secret WXH_SECRETS_B64"; exit 1; fi
          {
            echo "WXH_MASTER_KEY=$MK"
            echo "WXH_SECRETS_B64=$SB"
          } >> "$GITHUB_ENV"

      - name: Compute native cache key
        id: native-key
        run: echo "key=$(printf '%s' "$WXH_MASTER_KEY" | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Restore native libraries
        id: native-cache
        uses: actions/cache@v4
        with:
          path: app/src/main/jniLibs
          key: native-${{ runner.os }}-${{ steps.native-key.outputs.key }}-${{ hashFiles('app/src/main/jni/**', 'app/build.gradle') }}

      - name: Install Android NDK
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: |
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "${ANDROID_SDK_ROOT:-$ANDROID_HOME}" -path '*/cmdline-tools/*/bin/sdkmanager' -type f | sort | tail -1)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "ndk;28.2.13676358"

      - name: Build native libraries
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: ./gradlew buildNativeSecret --console=plain

      - name: Build all release variants
        run: ./gradlew assembleRelease --console=plain --stacktrace

      - name: Collect release assets
        run: |
          test -f app/build/generated/featurepacks/wx244/wx6_2.44.zip
          test -f app/build/generated/featurepacks/wx30/x7_3.0.zip
          mkdir -p dist/public dist/core
          for apk in app/build/outputs/apk/*/release/WeXposedHook-*.apk; do
            case "$apk" in
              *-full.apk) cp "$apk" dist/core/ ;;
              *) cp "$apk" dist/public/ ;;
            esac
          done
          echo "public:"; ls -1 dist/public
          echo "core:"; ls -1 dist/core
          test "$(ls -1 dist/public/*.apk | wc -l)" -eq 4
          test "$(ls -1 dist/core/*.apk | wc -l)" -eq 4

      - name: Upload workflow artifacts (every build)
        uses: actions/upload-artifact@v4
        with:
          name: apks
          path: dist/**
          if-no-files-found: error

      - name: Checkout public repository
        if: github.repository == 'ShadowSmallBaby/WechatXposedHookCore'
        uses: actions/checkout@v4
        with:
          repository: ShadowSmallBaby/WechatXposedHook
          token: ${{ secrets.PUBLIC_REPO_TOKEN }}
          ref: main
          path: public-repo

      - name: Sync README / CHANGELOG to public repository
        if: github.repository == 'ShadowSmallBaby/WechatXposedHookCore'
        id: docs
        run: |
          cd public-repo
          cp ../README.md README.md
          if [ -f ../CHANGELOG.md ]; then cp ../CHANGELOG.md CHANGELOG.md; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if [ -f CHANGELOG.md ]; then git add CHANGELOG.md; fi
          if git diff --cached --quiet; then
            echo "公开仓文档无变化"
          else
            git commit -m "docs: 同步 README/CHANGELOG"
            git push origin HEAD:main
            echo "公开仓文档已更新"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build release notes
        run: |
          tag="${GITHUB_REF_NAME}"
          section="$(mktemp)"
          if [ -f CHANGELOG.md ]; then
            awk -v t="## $tag" '
              $0 == t { found=1; next }
              found && substr($0, 1, 3) == "## " { exit }
              found { print }
            ' CHANGELOG.md > "$section"
          fi
          {
            echo "## 更新内容 / Changes"
            echo
            if [ -s "$section" ]; then
              cat "$section"
            else
              echo "本次发布未在 CHANGELOG 中记录。"
            fi
            echo
            echo "## 下载哪个包？ / Which APK?"
            echo
            echo "| 微X 版本 | 现代 LibXposed（API ≥ 102） | 经典 Xposed / API < 102 |"
            echo "|---|---|---|"
            echo "| 微X 2.44 | \`WeXposedHook-modern-wx2.44-${tag}.apk\` | \`WeXposedHook-legacy-wx2.44-${tag}.apk\` |"
            echo "| X 3.0 | \`WeXposedHook-modern-wx3.0-${tag}.apk\` | \`WeXposedHook-legacy-wx3.0-${tag}.apk\` |"
            echo
            echo "- 先确认已安装的微X是 **2.44** 还是 **X 3.0**，再按框架二选一。"
            echo "- 现代包若提示「该模块需要更新的 Xposed 版本 102」，改用 **legacy** 包。"
            echo "- 作用域勾选 **微信**。"
            echo "- 环境要求：Android 8.0+、微信 8.0.49、微X模块 2.44 / X 3.0。"
            echo "- 公开仓 Release 提供公开版；核心仓 Release 提供对应的 \`-full\` 完整版。"
            echo
            prev=$(git describe --tags --abbrev=0 "${tag}^" 2>/dev/null || true)
            if [ -n "$prev" ]; then
              echo "**Full Changelog**: https://github.com/ShadowSmallBaby/WechatXposedHook/compare/${prev}...${tag}"
            fi
          } > release-notes.md
          echo "--- release notes ---"
          cat release-notes.md

      - name: Publish public APKs to public repository
        if: github.repository == 'ShadowSmallBaby/WechatXposedHookCore'
        uses: softprops/action-gh-release@v2
        with:
          repository: ShadowSmallBaby/WechatXposedHook
          token: ${{ secrets.PUBLIC_REPO_TOKEN }}
          tag_name: ${{ github.ref_name }}
          target_commitish: main
          files: dist/public/*.apk
          fail_on_unmatched_files: true
          body_path: release-notes.md

      - name: Publish full APKs to core repository
        if: github.repository == 'ShadowSmallBaby/WechatXposedHookCore'
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ github.token }}
          tag_name: ${{ github.ref_name }}
          target_commitish: main
          files: dist/core/*.apk
          fail_on_unmatched_files: true
          body_path: release-notes.md
