name: Build tool APKs

on:
  push:
    tags: [ 'WXH-v*' ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android platform
        run: |
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "${ANDROID_SDK_ROOT:-$ANDROID_HOME}" -path '*/cmdline-tools/*/bin/sdkmanager' -type f | sort | tail -1)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-37.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build tool release variants
        run: ./gradlew :tool:assembleRelease --console=plain --stacktrace

      - name: Verify bundled rule assets
        run: |
          assets="15fdaf36c280ecb8ea26cd1ceb9325c8 534a9729a0c461cbd7a4379978fb742 5dbc98dcc983a7728bd82d1a47546e 7b52d971be46223af131dcdbf0ec26 13ecc51414db3b4612c5518ea4158a4"
          for apk in tool/build/outputs/apk/*/release/WeXposedTool-*.apk; do
            for asset in $assets; do
              unzip -Z1 "$apk" | grep -qx "assets/$asset" || {
                echo "::error::missing assets/$asset in $apk"
                exit 1
              }
            done
          done

      - name: Collect release assets
        run: |
          mkdir -p dist
          for apk in tool/build/outputs/apk/*/release/WeXposedTool-*.apk; do
            cp "$apk" dist/
          done
          ls -1 dist
          test "$(ls -1 dist/*.apk | wc -l)" -eq 3

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tool-apks
          path: dist/*.apk
          if-no-files-found: error

      - name: Build release notes
        run: |
          tag="${GITHUB_REF_NAME}"
          ver="${tag#WXH-}"
          section_key="$tag"
          case "$tag" in
            WXH-*) section_key="WXT-${tag#WXH-}" ;;
          esac
          section="$(mktemp)"
          if [ -f CHANGELOG.md ]; then
            awk -v t="## $section_key" '
              $0 == t { found=1; next }
              found && substr($0, 1, 3) == "## " { exit }
              found { print }
            ' CHANGELOG.md > "$section"
          fi
          {
            echo "## 更新内容 / Changes"
            echo
            if [ -s "$section" ]; then
              cat "$section"
            else
              echo "本次发布未在 CHANGELOG 中记录。"
            fi
            echo
            echo "## 下载哪个包？ / Which APK?"
            echo
            echo "| 框架 | 文件 |"
            echo "|---|---|"
            echo "| 新版 LSPosed（模块页面 API ≥ 102） | \`WeXposedTool-${ver}-modern.apk\` |"
            echo "| 仅支持 API 101 的 LibXposed 框架 | \`WeXposedTool-${ver}-modern101.apk\` |"
            echo "| 旧版 LSPosed / EdXposed / 经典 Xposed | \`WeXposedTool-${ver}-legacy.apk\` |"
            echo
            echo "- 三个 APK 是同一个应用（同包名、同签名），按框架能力三选一。"
            echo "- 切换变体请**覆盖安装，不要先卸载**，否则设置会被清空。"
            echo "- 作用域勾选 **微信**；安装后强制停止微信再重新打开。"
          } > release-notes.md
          echo "--- release notes ---"
          cat release-notes.md

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ github.token }}
          tag_name: ${{ github.ref_name }}
          files: dist/*.apk
          fail_on_unmatched_files: true
          body_path: release-notes.md